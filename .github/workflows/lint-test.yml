name: lint-test

on:
  push:
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
  test:
    needs: [lint]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: |
            ezproxy-url-checker:ci

      - name: Run tests
        shell: bash
        run: |-
          ./scripts/generate-files.sh $(pwd)/fixtures
          CONTAINER=$(docker run \
            --rm \
            -d \
            -v $(pwd)/config:/app/config \
            ezproxy-url-checker:ci)
          docker logs $CONTAINER
          docker exec $CONTAINER /bin/bash /app/scripts/test.sh
          docker stop $CONTAINER
  build-push-ghcr:
    if: github.event_name == 'push'
    needs: [test]
    uses: lehigh-university-libraries/gha/.github/workflows/build-push-ghcr.yaml@main
    permissions:
      contents: read
      packages: write
    secrets: inherit
