name: lint-test

on:
  push:
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
  test:
    needs: [lint]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: |
            ezproxy-url-checker:ci

      - name: Run tests
        shell: bash
        run: |-
          # generate the config files with the image itself, as documented in the README
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$(pwd)/fixtures:/fixtures:ro" \
            -v "$(pwd)/config:/app/config" \
            ezproxy-url-checker:ci generate /fixtures
          CONTAINER=$(docker run \
            --rm \
            -d \
            -p 127.0.0.1:8888:8888 \
            -v "$(pwd)/config:/app/config:ro" \
            ezproxy-url-checker:ci)
          trap 'docker stop "$CONTAINER" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail "http://127.0.0.1:8888/proxyUrl?url=scholar.google.com" >/dev/null; then
              break
            fi
            sleep 1
          done
          ./scripts/test.sh
  build-push-ghcr:
    needs: [test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log into ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch pushes are published under the branch name (e.g. `main`).
      # Tag pushes publish the release tag plus its semver aliases and `latest`:
      #   v1.2.3 -> v1.2.3, 1.2.3, 1.2, 1, latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
